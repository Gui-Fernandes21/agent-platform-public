llm:
  provider: openai
  config:
    model: gpt-4o-mini
    api_key: ${OPENAI_API_KEY}

embedder:
  provider: openai
  config:
    model: text-embedding-3-small
    api_key: ${OPENAI_API_KEY}

vector_store:
  provider: qdrant
  config:
    host: qdrant
    port: 6333
    collection_name: mem0_server

graph_store:
  provider: neo4j
  config:
    url: bolt://neo4j:7687
    username: neo4j
    password: ${NEO4J_PASSWORD}

history_db_path: /app/history.db
